---

pfqueue_main_version: "{{ pfqueue_version[0:3] }}"

pfqueue_install_path: /usr/local/opt/pfqueue/{{ pfqueue_version }}

pfqueue_delegate_to: localhost

pfqueue_local_tmp_directory: "{{
  lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
  default(lookup('env', 'HOME') ~ '/.cache/ansible/pfqueue', true) }}/{{ pfqueue_version }}"

pfqueue_dependencies: []

# -----------------------------------------------------------------------------

pfqueue_defaults_directory: /etc/default

pfqueue_defaults_release:
  provider: github
  host: https://github.com
  project: bodsch
  repository: pfqueue
  file: pfqueue-{{ pfqueue_version }}-{{ ansible_facts.system | lower }}-{{ system_architecture }}.tar.gz
  binary: pfqueue

go_arch_map:
  x86_64: 'amd64'
  aarch64: 'arm64'
  armv7l: 'armv7'
  armv6l: 'armv6'

system_architecture: "{{ go_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"

systemd_lib_directory: /lib/systemd/system

_pfqueue_gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
_pfqueue_gh_user: "{{ lookup('env', 'GH_USER') }}"
_pfqueue_fj_token: "{{ lookup('env', 'FJ_TOKEN') }}"
_pfqueue_fj_user: "{{ lookup('env', 'FJ_USER') }}"

# credentials matching the configured release provider (empty when unset)
_pfqueue_scm_token: "{{ _pfqueue_fj_token if pfqueue_release.provider == 'forgejo' else _pfqueue_gh_token }}"
_pfqueue_scm_user: "{{ _pfqueue_fj_user if pfqueue_release.provider == 'forgejo' else _pfqueue_gh_user }}"

...
