---

- name: start and enable service
  when:
    - not running_in_check_mode
  ansible.builtin.service:
    name: dovecot
    state: "{{ dovecot_service.state | default('started') }}"
    enabled: "{{ dovecot_service.enabled | default(true) | bool }}"
  tags:
    - configuration
    - dovecot
    - dovecot-start-enable-service

...
