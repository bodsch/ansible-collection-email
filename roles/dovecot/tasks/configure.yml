---

- name: user and group handling
  when:
    - not running_in_check_mode
    - dovecot_virtual_user.name != "root"
  block:
    - name: create dovecot virtual user group
      ansible.builtin.group:
        name: "{{ dovecot_virtual_user.name }}"
        state: present
        system: false
        gid: "{{ dovecot_virtual_user.gid }}"

    - name: create dovecot virtual user
      ansible.builtin.user:
        name: "{{ dovecot_virtual_user.name }}"
        groups: "{{ dovecot_virtual_user.name }}"
        append: true
        shell: /usr/sbin/nologin
        system: false
        uid: "{{ dovecot_virtual_user.uid }}"
        createhome: true
        home: "{{ dovecot_virtual_user.home }}"

# - name: gathering facts now
#   when:
#     - not running_in_check_mode
#   ansible.builtin.setup:

# The template tree carries one directory per dovecot version:
#
#   templates/etc/dovecot/2.3/...
#   templates/etc/dovecot/2.4/...
#
# The detected short version ("2.4") picks the directory, which is why no
# template has to compare versions itself. The filter returns the file names
# of that version, plus the files of every other version that this one does
# not have - see "remove configuration files of another dovecot version".
- name: sort template tree by dovecot version
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    _dovecot_templates: "{{
      lookup('community.general.filetree', 'templates/etc/dovecot') |
      bodsch.email.dovecot_template_versions(version=dovecot_short_version) }}"
  no_log: true

- name: fail on unsupported dovecot version
  when:
    - not running_in_check_mode
    - not _dovecot_templates.available | bool
  ansible.builtin.fail:
    msg: |
      Dovecot {{ dovecot_version }} is not supported by this role.
      There is no templates/etc/dovecot/{{ dovecot_short_version }} directory.
      Supported versions: {{ _dovecot_templates.versions | join(', ') }}

- name: include version specific defaults
  when:
    - not running_in_check_mode
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      paths:
        - "vars"
      files:
        - "dovecot-{{ dovecot_short_version }}.yml"
      skip: true
  no_log: true

- name: apply version specific defaults
  when:
    - not running_in_check_mode
    - _dovecot_version_defaults | default({}) | count > 0
  ansible.builtin.set_fact:
    dovecot_defaults_config: "{{ dovecot_defaults_config | combine(_dovecot_version_defaults.config | default({}), recursive=True) }}"
    dovecot_defaults_auth: "{{ dovecot_defaults_auth | combine(_dovecot_version_defaults.auth | default({}), recursive=True) }}"
    dovecot_defaults_logging: "{{ dovecot_defaults_logging | combine(_dovecot_version_defaults.logging | default({}), recursive=True) }}"
    dovecot_defaults_mail: "{{ dovecot_defaults_mail | combine(_dovecot_version_defaults.mail | default({}), recursive=True) }}"
    dovecot_defaults_master: "{{ dovecot_defaults_master | combine(_dovecot_version_defaults.master | default({}), recursive=True) }}"
    dovecot_defaults_imap: "{{ dovecot_defaults_imap | combine(_dovecot_version_defaults.imap | default({}), recursive=True) }}"
    dovecot_defaults_lmtp: "{{ dovecot_defaults_lmtp | combine(_dovecot_version_defaults.lmtp | default({}), recursive=True) }}"
    dovecot_defaults_pop3: "{{ dovecot_defaults_pop3 | combine(_dovecot_version_defaults.pop3 | default({}), recursive=True) }}"
    dovecot_defaults_submission: "{{ dovecot_defaults_submission | combine(_dovecot_version_defaults.submission | default({}), recursive=True) }}"
    dovecot_defaults_lda: "{{ dovecot_defaults_lda | combine(_dovecot_version_defaults.lda | default({}), recursive=True) }}"
    dovecot_defaults_managesieve: "{{ dovecot_defaults_managesieve | combine(_dovecot_version_defaults.managesieve | default({}), recursive=True) }}"
    dovecot_defaults_authentications: "{{ dovecot_defaults_authentications | combine(_dovecot_version_defaults.authentications | default({}), recursive=True) }}"
  no_log: true

- name: merge dovecot configuration between defaults and custom
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    dovecot_config: "{{ dovecot_defaults_config | combine(dovecot_config, recursive=True) }}"
    dovecot_auth: "{{ dovecot_defaults_auth | combine(dovecot_auth, recursive=True) }}"
    dovecot_director: "{{ dovecot_defaults_director | combine(dovecot_director, recursive=True) }}"
    dovecot_logging: "{{ dovecot_defaults_logging | combine(dovecot_logging, recursive=True) }}"
    dovecot_mail: "{{ dovecot_defaults_mail | combine(dovecot_mail, recursive=True) }}"
    dovecot_master: "{{ dovecot_defaults_master | combine(dovecot_master, recursive=True) }}"
    dovecot_ssl: "{{ dovecot_defaults_ssl | combine(dovecot_ssl, recursive=True) }}"
    dovecot_tcpwrapper: "{{ dovecot_defaults_tcpwrapper | combine(dovecot_tcpwrapper, recursive=True) }}"
    dovecot_lda: "{{ dovecot_defaults_lda | combine(dovecot_lda, recursive=True) }}"
    dovecot_mailboxes: "{{ dovecot_defaults_mailboxes | combine(dovecot_mailboxes, recursive=True) }}"
    dovecot_imap: "{{ dovecot_defaults_imap | combine(dovecot_imap, recursive=True) }}"
    dovecot_lmtp: "{{ dovecot_defaults_lmtp | combine(dovecot_lmtp, recursive=True) }}"
    dovecot_managesieve: "{{ dovecot_defaults_managesieve | combine(dovecot_managesieve, recursive=True) }}"
    dovecot_pop3: "{{ dovecot_defaults_pop3 | combine(dovecot_pop3, recursive=True) }}"
    dovecot_submission: "{{ dovecot_defaults_submission | combine(dovecot_submission, recursive=True) }}"
    dovecot_acl: "{{ dovecot_defaults_acl | combine(dovecot_acl, recursive=True) }}"
    dovecot_plugin: "{{ dovecot_defaults_plugin | combine(dovecot_plugin, recursive=True) }}"
    dovecot_quota: "{{ dovecot_defaults_quota | combine(dovecot_quota, recursive=True) }}"
    dovecot_sieve_extprograms: "{{ dovecot_defaults_sieve_extprograms | combine(dovecot_sieve_extprograms, recursive=True) }}"
    dovecot_sieve: "{{ dovecot_defaults_sieve | combine(dovecot_sieve, recursive=True) }}"
    dovecot_metrics: "{{ dovecot_defaults_metrics | combine(dovecot_metrics, recursive=True) }}"
    dovecot_fts: "{{ dovecot_defaults_fts | combine(dovecot_fts, recursive=True) }}"
    dovecot_dict_server: "{{ dovecot_defaults_dict_server | combine(dovecot_dict_server, recursive=True) }}"
    dovecot_authentications: "{{ dovecot_defaults_authentications | combine(dovecot_authentications, recursive=True) }}"
    dovecot_dict_auth: "{{ dovecot_defaults_dict_auth | combine(dovecot_dict_auth, recursive=True) }}"
    dovecot_dict_sql: "{{ dovecot_defaults_dict_sql | combine(dovecot_dict_sql, recursive=True) }}"
    dovecot_ldap: "{{ dovecot_defaults_ldap | combine(dovecot_ldap, recursive=True) }}"
    dovecot_sql: "{{ dovecot_defaults_sql | combine(dovecot_sql, recursive=True) }}"
  no_log: true

# These three checks need the MERGED variables and the detected dovecot
# version, which is why they do not live in validate.yml.
#
# All three describe configurations that "doveconf -n" calls valid and that
# still leave the client without an INBOX.
- name: validate mail storage and inbox namespace
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
  vars:
    # "mail_driver + mail_path" is the 2.4 spelling, "mail_location" the 2.3
    # one - the template accepts both.
    _dovecot_global_location: "{{
      (dovecot_mail.mail_driver | default('', true)) ~
      (dovecot_mail.mail_location | default('', true)) }}"
    # a namespace brings its own storage with mail_driver, location or
    # mail_location; these are the ones that bring none.
    _dovecot_ns_without_location: "{{
      dovecot_mail.namespaces | default([])
      | rejectattr('mail_driver', 'defined')
      | rejectattr('location', 'defined')
      | rejectattr('mail_location', 'defined')
      | map(attribute='name', default='<unnamed>') | list }}"
    _dovecot_inbox_namespaces: "{{
      dovecot_mail.namespaces | default([])
      | selectattr('inbox', 'defined')
      | selectattr('inbox')
      | map(attribute='name', default='<unnamed>') | list }}"
    # dovecot_mailboxes.namespaces is a list of single key mappings, the key
    # is the namespace name.
    _dovecot_mailbox_ns_names: "{{
      dovecot_mailboxes.namespaces | default([]) | map('list') | map('first') | list }}"
    _dovecot_mail_ns_names: "{{
      dovecot_mail.namespaces | default([]) | map(attribute='name', default='') | list }}"
  block:
    # Dovecot 2.4 removed mail location autodetection. 2.3 fell back to
    # ~/Maildir or /var/mail/%u, 2.4 resolves mail_driver and mail_path to an
    # empty string and the client reports the INBOX as unavailable.
    - name: validate mail storage location
      when:
        - dovecot_short_version is version('2.4', '>=')
      ansible.builtin.assert:
        that:
          - _dovecot_global_location | length > 0 or
            (dovecot_mail.namespaces | default([]) | count > 0 and
             _dovecot_ns_without_location | count == 0)
        fail_msg: |
          No mail storage is configured for dovecot {{ dovecot_version }}.

          Dovecot 2.4 removed mail location autodetection. Without a storage
          location "doveconf -n" still passes, but there is no INBOX and every
          client reports it as unavailable.

          Set either globally
            dovecot_mail:
              mail_driver: maildir
              mail_path: "~/Maildir"
          or per namespace
            dovecot_mail:
              namespaces:
                - name: inbox
                  inbox: true
                  location: "maildir:~/Maildir"

          Namespaces without a location: {{ _dovecot_ns_without_location | join(', ') | default('-', true) }}
        success_msg: "mail storage ok"
        quiet: true

    # Exactly one namespace may carry inbox = yes. None means there is no
    # INBOX at all, more than one makes dovecot refuse to start.
    - name: validate inbox namespace
      when:
        - dovecot_mail.namespaces | default([]) | count > 0
      ansible.builtin.assert:
        that:
          - _dovecot_inbox_namespaces | count == 1
        fail_msg: |
          {{ _dovecot_inbox_namespaces | count }} namespaces in dovecot_mail.namespaces
          carry "inbox: true" - there has to be exactly one.

          Without it dovecot has no INBOX and the client reports it as
          unavailable; with more than one dovecot refuses to start.

          Namespaces: {{ _dovecot_mail_ns_names | join(', ') }}
          With inbox: {{ _dovecot_inbox_namespaces | join(', ') | default('-', true) }}
        success_msg: "inbox namespace ok: {{ _dovecot_inbox_namespaces | join(', ') }}"
        quiet: true

    # 15-mailboxes.conf adds "mailbox { }" blocks to a namespace BY NAME. A
    # name that 10-mail.conf does not define opens a second namespace instead,
    # and the special use folders end up somewhere the client never looks.
    - name: validate mailbox namespace names
      when:
        - _dovecot_mailbox_ns_names | count > 0
        - _dovecot_mail_ns_names | count > 0
      ansible.builtin.assert:
        that:
          - _dovecot_mailbox_ns_names | difference(_dovecot_mail_ns_names) | count == 0
        fail_msg: |
          dovecot_mailboxes.namespaces refers to namespaces that
          dovecot_mail.namespaces does not define:
          {{ _dovecot_mailbox_ns_names | difference(_dovecot_mail_ns_names) | join(', ') }}

          The names have to match, otherwise 15-mailboxes.conf opens a SECOND
          namespace and the special use folders are created there.

          dovecot_mail.namespaces:      {{ _dovecot_mail_ns_names | join(', ') }}
          dovecot_mailboxes.namespaces: {{ _dovecot_mailbox_ns_names | join(', ') }}
        success_msg: "mailbox namespace name(s) ok: {{ _dovecot_mailbox_ns_names | join(', ') }}"
        quiet: true

- name: create dovecot directories
  when:
    - not running_in_check_mode
  bodsch.core.directories:
    base_path: /etc/dovecot
    mode: "0755"
    paths:
      - path: "{{ dovecot_logging_directory }}"
      - path: conf.d
      - path: auth.d
      - path: sql.d

# Dovecot creates the per user part of a storage path itself, but not the
# static parent above it - see dovecot_manage_mail_directories in defaults.
# Without this, subscribing to a mailbox fails with
#   mkdir(/var/mail/CONTROL/<domain>) failed: Permission denied
# while "doveconf -n" reports nothing at all.
- name: create mail storage directories
  when:
    - not running_in_check_mode
    - dovecot_manage_mail_directories | bool
  bodsch.core.directories:
    base_path: /etc/dovecot
    owner: "{{ dovecot_virtual_user.name }}"
    group: "{{ dovecot_virtual_user.name }}"
    mode: "{{ dovecot_mail_directories_mode }}"
    paths: "{{ dovecot_mail | bodsch.email.dovecot_storage_directories(dovecot_mailboxes) | bodsch.core.directory_path() }}"

- name: create dovecot.conf
  when:
    - not running_in_check_mode
  ansible.builtin.template:
    src: etc/dovecot/{{ dovecot_short_version }}/dovecot.conf.j2
    dest: /etc/dovecot/dovecot.conf
    backup: true
    mode: "0644"
  notify:
    - restart dovecot

- name: create splitted configurations
  when:
    - not running_in_check_mode
    - _dovecot_templates.files['conf.d'] | count > 0
  ansible.builtin.template:
    src: etc/dovecot/{{ dovecot_short_version }}/conf.d/{{ item }}.j2
    dest: /etc/dovecot/conf.d/{{ item }}
    backup: true
    mode: "0644"
  loop: "{{ _dovecot_templates.files['conf.d'] }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - restart dovecot

- name: create auth configurations
  when:
    - not running_in_check_mode
    - _dovecot_templates.files['auth.d'] | count > 0
  ansible.builtin.template:
    src: etc/dovecot/{{ dovecot_short_version }}/auth.d/{{ item }}.j2
    dest: /etc/dovecot/auth.d/{{ item }}
    backup: true
    mode: "0644"
  loop: "{{ _dovecot_templates.files['auth.d'] }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - restart dovecot

- name: create conf.ext configuration files
  when:
    - not running_in_check_mode
    - _dovecot_templates.files['root'] | count > 0
  ansible.builtin.template:
    src: etc/dovecot/{{ dovecot_short_version }}/{{ item }}.j2
    dest: /etc/dovecot/{{ item }}
    backup: true
    mode: "0644"
  loop: "{{ _dovecot_templates.files['root'] }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - restart dovecot

# Dovecot reads every file in conf.d and auth.d, so a file left behind by
# another version of this role keeps being parsed. The template tree is the
# only source for these names: everything below templates/etc/dovecot/<version>
# belongs to exactly that version, so the set difference between the versions
# is the list of files that have to go.
#
# fileglob cannot collect them. It resolves everything up to the last "/" as a
# literal directory, so a wildcard in the directory part - "*/conf.d/*.j2" -
# never matches. filetree walks the tree instead.
- name: determine configuration files left over from another dovecot version
  when:
    - not running_in_check_mode
    - dovecot_remove_stale_configs | bool
  ansible.builtin.set_fact:
    _dovecot_stale_configs: "{{
      (_dovecot_templates.stale['conf.d'] | map('regex_replace', '^', '/etc/dovecot/conf.d/') | list) +
      (_dovecot_templates.stale['auth.d'] | map('regex_replace', '^', '/etc/dovecot/auth.d/') | list) +
      (_dovecot_templates.stale['root']   | map('regex_replace', '^', '/etc/dovecot/') | list) }}"

# Dovecot 2.4 refuses to start when it finds a setting it does not know, so a
# 2.3 -> 2.4 upgrade has to get rid of the configuration files of the old
# version (10-director.conf, 10-tcpwrapper.conf, auth-checkpassword.conf.ext,
# dovecot-sql.conf.ext, ...).
#
# Only file names that belong to another template version of THIS role are
# removed. Files shipped by the distribution package and files written by hand
# are never touched, because the role does not know their names.
- name: remove configuration files of another dovecot version
  when:
    - not running_in_check_mode
    - dovecot_remove_stale_configs | bool
    - _dovecot_stale_configs | default([]) | count > 0
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _dovecot_stale_configs }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - restart dovecot

...
