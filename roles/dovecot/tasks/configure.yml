---

- name: user and group handling
  when:
    - not running_in_check_mode
    - dovecot_virtual_user.name != "root"
  block:
    - name: create dovecot virtual user group
      ansible.builtin.group:
        name: "{{ dovecot_virtual_user.name }}"
        state: present
        system: false
        gid: "{{ dovecot_virtual_user.gid }}"

    - name: create dovecot virtual user
      ansible.builtin.user:
        name: "{{ dovecot_virtual_user.name }}"
        groups: "{{ dovecot_virtual_user.name }}"
        append: true
        shell: /usr/sbin/nologin
        system: false
        uid: "{{ dovecot_virtual_user.uid }}"
        createhome: true
        home: "{{ dovecot_virtual_user.home }}"

- name: gathering facts now
  when:
    - not running_in_check_mode
  ansible.builtin.setup:

- name: collect available template versions
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    _dovecot_templates: "{{
      lookup('community.general.filetree', 'templates/etc/dovecot') | bodsch.email.dovecot_template_versions(version=dovecot_short_version) }}"
      # map('dirname') | map('basename') | sort }}"

- name: collect available template versions
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    dovecot_template_versions: "{{ _dovecot_templates.versions }}"
    dovecot_template_available: "{{ _dovecot_templates.available | bool }}"

- name: d
  debug:
    msg:
      - "{{ dovecot_template_versions }}"
      - "{{ dovecot_template_available }}"
