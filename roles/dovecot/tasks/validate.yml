---

# Dovecot resolves storage and quota driver names at RUNTIME, not while
# parsing the configuration. "doveconf -n" happily accepts
#
#   mail_driver = totalnonsense
#   quota_driver = totalnonsense
#
# so a typo produces a configuration that every syntax check calls valid and
# that only fails once mail is delivered. These asserts move that failure to
# the ansible run.
#
# Set dovecot_validate_drivers=false when you use a storage or quota driver
# provided by a plugin this role does not know about.
#
# This runs BEFORE install.yml, so a typo fails the run before any package is
# installed. That means it sees the variables as the user set them, not the
# ones merged with dovecot_defaults_* in configure.yml - which is what we
# want: the role defaults carry no driver name of their own.

- name: collect configured storage drivers
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
  ansible.builtin.set_fact:
    _dovecot_storage_drivers: "{{ (
      [dovecot_mail.mail_driver | default('', true)] +
      [(dovecot_mail.mail_location | default('', true)) | split(':') | first] +
      (dovecot_mail.namespaces | default([]) | map(attribute='mail_driver', default='') | list) +
      (dovecot_mail.namespaces | default([]) | map(attribute='location', default='') | map('split', ':') | map('first') | list)
      ) | reject('equalto', '') | unique | sort }}"

- name: collect configured quota drivers
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
  ansible.builtin.set_fact:
    _dovecot_quota_drivers: "{{ (
      dovecot_quota.quotas | default({}) | dict2items |
      map(attribute='value') |
      map(attribute='quota_driver', default='') | list
      ) | reject('equalto', '') | unique | sort }}"

- name: validate storage drivers
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
    - _dovecot_storage_drivers | default([]) | count > 0
  ansible.builtin.assert:
    that:
      - _dovecot_storage_drivers | difference(dovecot_valid_mail_drivers) | count == 0
    fail_msg: |
      Unknown dovecot storage driver: {{ _dovecot_storage_drivers | difference(dovecot_valid_mail_drivers) | join(', ') }}
      Known drivers: {{ dovecot_valid_mail_drivers | join(', ') }}

      Dovecot does not reject an unknown driver while parsing the config, so
      this would only surface when mail is delivered. Fix the name, or set
      dovecot_validate_drivers=false if the driver comes from a plugin.
    success_msg: "storage driver(s) ok: {{ _dovecot_storage_drivers | join(', ') }}"
    quiet: true

- name: validate quota drivers
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
    - _dovecot_quota_drivers | default([]) | count > 0
  ansible.builtin.assert:
    that:
      - _dovecot_quota_drivers | difference(dovecot_valid_quota_drivers) | count == 0
    fail_msg: |
      Unknown dovecot quota driver: {{ _dovecot_quota_drivers | difference(dovecot_valid_quota_drivers) | join(', ') }}
      Known drivers: {{ dovecot_valid_quota_drivers | join(', ') }}

      Note that the dirsize quota driver was removed in dovecot 2.4; use the
      count driver together with quota-clone instead.
    success_msg: "quota driver(s) ok: {{ _dovecot_quota_drivers | join(', ') }}"
    quiet: true

# A namespace has to carry a name. Without one the template renders
# "namespace  { }", which dovecot 2.3 still accepts but 2.4 refuses with
# "namespace { } is missing section name".
#
# The type is checked as well, because the template silently drops a value it
# does not know - a typo would quietly turn a public namespace into a private
# one.
- name: collect namespaces
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
  # dovecot_mailboxes.namespaces is keyed BY the namespace name, so a name is
  # always present there. dovecot_mail.namespaces carries it as a field, and
  # that is where it can go missing.
  ansible.builtin.set_fact:
    _dovecot_namespaces: "{{ dovecot_mail.namespaces | default([]) }}"

- name: validate namespace names
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
    - _dovecot_namespaces | count > 0
  ansible.builtin.assert:
    that:
      - _dovecot_namespaces | selectattr('name', 'defined') |
        selectattr('name', 'ne', '') | list | count == _dovecot_namespaces | count
    fail_msg: |
      Every entry in dovecot_mail.namespaces needs a name.

      A namespace without one renders as "namespace  { }". Dovecot 2.3 still
      accepts that, dovecot 2.4 refuses to start with
      "namespace { } is missing section name".

      Configured namespaces: {{ _dovecot_namespaces }}
    success_msg: "namespace name(s) ok: {{ _dovecot_namespaces | map(attribute='name', default='<unnamed>') | join(', ') }}"
    quiet: true

- name: validate namespace types
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
    - _dovecot_namespaces | count > 0
  ansible.builtin.assert:
    that:
      - _dovecot_namespaces | selectattr('type', 'defined') |
        rejectattr('type', 'in', dovecot_valid_namespace_types) | list | count == 0
    fail_msg: |
      Unknown dovecot namespace type: {{ _dovecot_namespaces | selectattr('type', 'defined') | rejectattr('type', 'in', dovecot_valid_namespace_types) | map(attribute='type') | unique | join(', ') }}
      Known types: {{ dovecot_valid_namespace_types | join(', ') }}

      Note that "virtual" is a mail_driver, not a namespace type - a virtual
      namespace is type "private" with location "virtual:<path>".

      The template drops a type it does not know without a word, so a typo
      would quietly change what the namespace is.
    quiet: true

# sieve_script_type is not validated by dovecot either - "nonsense" is
# accepted and only fails when a mail is delivered.
- name: validate sieve script types
  when:
    - not running_in_check_mode
    - dovecot_validate_drivers | bool
    - dovecot_sieve.scripts | default({}) | count > 0
  ansible.builtin.assert:
    that:
      - dovecot_sieve.scripts | dict2items | map(attribute='value') |
        selectattr('sieve_script_type', 'defined') |
        rejectattr('sieve_script_type', 'in', dovecot_valid_sieve_script_types) |
        list | count == 0
    fail_msg: |
      Unknown sieve_script_type: {{ dovecot_sieve.scripts | dict2items | map(attribute='value') | selectattr('sieve_script_type', 'defined') | rejectattr('sieve_script_type', 'in', dovecot_valid_sieve_script_types) | map(attribute='sieve_script_type') | unique | join(', ') }}
      Known types: {{ dovecot_valid_sieve_script_types | join(', ') }}

      Dovecot accepts any value here while parsing the config; a typo would
      only show up when a mail is delivered.
    quiet: true

...
