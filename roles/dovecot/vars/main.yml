# dovecot >= 2.4 only
dovecot_defaults_fts:
  ## Selects the backend. Empty means full text search is off - configuring a
  ## backend below does NOT switch it on. This is what "plugin { fts = ... }"
  ## did in 2.3.
  driver: ""                                        # default: "" | ['flatcurve','solr','xapian','elastic']
  autoindex: ""                                     # default: true
  autoindex_max_recent_msgs: ""                     # default: 999
  search_add_missing: ""                            # default: true
  search_read_fallback: ""                          # default: true
  search_timeout: ""                                # default: 30 secs
  message_max_size: ""                              # default: unlimited

  ## attachment decoding
  decoder_driver: ""                                # default: "" | ['tika','script']
  decoder_tika_url: ""                              # with decoder_driver: tika
  decoder_script_socket_path: ""                    # with decoder_driver: script

  ## Backend configuration, rendered as "fts <name> { ... }".
  ## Accepts a mapping or a list of single key mappings.
  backends: {}
    # solr:
    #   url: http://localhost:8983/solr/dovecot/
    #   batch_size: 1000
    # flatcurve:
    #   substring_search: true

  ## language handling, applies regardless of the backend
  language_filters: []                              # default: normalizer-icu snowball stopwords
  language_tokenizers: []                           # default: generic email-address
  language_tokenizer_generic_algorithm: ""          # default: simple
  language_filter_stopwords_dir: ""                 # default: /usr/share/dovecot/stopwords

  ## rendered as "language <name> { ... }"
  language: []
    # - en:
    #     default: true
    #     filters:
    #       - lowercase
    #       - snowball
    #       - english-possessive
    #       - stopwords

