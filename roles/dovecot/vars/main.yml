---

# Dovecot resolves these at runtime and accepts ANY name while parsing the
# config, so the role checks them (see tasks/validate.yml).
dovecot_valid_mail_drivers:
  - maildir
  - mbox
  - sdbox
  - mdbox
  - imapc
  - pop3c
  - raw
  - shared
  - virtual
  - fail

# A namespace without a name renders as "namespace  { }". Dovecot 2.3 still
# accepts that, 2.4 refuses to start with "namespace { } is missing section
# name". Note that 'virtual' is a mail_driver, not a namespace type.
dovecot_valid_namespace_types:
  - private
  - public
  - shared

dovecot_valid_quota_drivers:
  - count
  - maildir
  - fs
  - imapc
  # dirsize was removed in dovecot 2.4 - use count plus quota-clone

dovecot_dependencies:
  - iproute2

dovecot_packages: []

# Full text search backend -> packages, overridden per distribution in
# vars/<os>.yml. Only the backend named by dovecot_fts.driver is installed.
dovecot_fts_packages: {}

# ---------------------------------------------------------------------------------------

dovecot_defaults_config:
  # dovecot >= 2.4 only: must be the first settings in dovecot.conf.
  # empty means "use the detected dovecot version".
  config_version: ""
  storage_version: ""
  # dovecot >= 2.4 enables no protocol by default. When this list is empty the
  # role falls back to '!include_try /usr/share/dovecot/protocols.d/*.protocol'.
  protocols: []
  listen:
    - "*"
    - "::"
  base_dir: /run/dovecot/
  instance_name: "{{ ansible_facts.fqdn }}"
  login_greeting: "Dovecot ready."
  login_trusted_networks: []
  login_access_sockets: []
  auth_proxy_self: ""
  verbose_proctitle: ""                             # true
  shutdown_clients: ""                              # false
  doveadm_worker_count: ""                          # 0
  doveadm_socket_path: doveadm-server
  import_environment: []
  # - TZ
  ##
  ##
  # dict {
  #   #quota = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
  #   #expire = sqlite:/etc/dovecot/dovecot-dict-sql.conf.ext
  # }
  dictionaries: {}
  #   quota: mysql:/etc/dovecot/dovecot-dict-sql.conf.ex
  #   expire: sqlite:/etc/dovecot/dovecot-dict-sql.conf.ext

dovecot_defaults_auth:
