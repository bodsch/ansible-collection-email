---

dovecot_logging_directory: /var/log/dovecot

# Remove configuration files that belong to another dovecot version of this
# role after an upgrade. Dovecot 2.4 aborts on unknown settings, so leftovers
# from 2.3 (10-director.conf, auth-checkpassword.conf.ext, ...) keep it from
# starting. Only file names this role knows from one of its template versions
# are removed - package and hand written files are left alone.
dovecot_remove_stale_configs: true

# Check storage and quota driver names before writing the configuration.
# Dovecot itself accepts any name and only fails at runtime.
dovecot_validate_drivers: true

dovecot_service:
  state: started
  enabled: true

dovecot_config:
  listen:
    - "*"

dovecot_virtual_user:
  name: vmail
  home: /var/vmail
  uid: 1101
  gid: 1101

dovecot_auth: {}
dovecot_director: {}
dovecot_logging: {}
dovecot_mail: {}
dovecot_master: {}
dovecot_ssl: {}
dovecot_tcpwrapper: {}
dovecot_lda: {}
dovecot_mailboxes: {}
dovecot_imap: {}
dovecot_lmtp: {}
dovecot_managesieve: {}
dovecot_pop3: {}
dovecot_submission: {}
dovecot_acl: {}
dovecot_plugin: {}
dovecot_quota: {}
dovecot_sieve_extprograms: {}
dovecot_sieve: {}

# dovecot >= 2.4 only
dovecot_metrics: {}
dovecot_fts: {}
dovecot_dict_server: {}
dovecot_authentications: []

dovecot_auth_checkpassword: {}
dovecot_auth_deny: {}
dovecot_auth_dict: {}
dovecot_auth_ldap: {}
dovecot_auth_master: {}
dovecot_auth_passwdfile: {}
dovecot_auth_sql: {}
dovecot_auth_static: {}
dovecot_auth_system: {}
dovecot_auth_vpopmail: {}

dovecot_dict_auth: {}
dovecot_dict_sql: {}

dovecot_ldap: {}
dovecot_sql: {}

...
