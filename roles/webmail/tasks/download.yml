---

- name: define download information
  ansible.builtin.set_fact:
    webmail_release: "{{ webmail_defaults_release | combine(webmail_release, recursive=True) }}"

- name: resolve webmail release
  when:
    - not running_in_check_mode
  delegate_to: localhost
  become: false
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ webmail_release.provider }}"
    host: "{{ webmail_release.host }}"
    project: "{{ webmail_release.project }}"
    repository: "{{ webmail_release.repository }}"
    asset: "webmail_{version}.tar.gz"
    architecture: "{{ ansible_facts.architecture }}"
    system: "{{ ansible_facts.system }}"
    version: "{{ webmail_version }}"
    password: "{{ _webmail_scm_token | default(omit, true) }}"
  register: _release

- name: re-define webmail_version
  when:
    - not running_in_check_mode
    - webmail_version == "latest"
    - _release.version is defined
    - _release.version | length > 0
  ansible.builtin.set_fact:
    webmail_version: "{{ _release.version }}"

- name: detect the downloaded webmail archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ webmail_delegate_to }}"
  run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ webmail_local_tmp_directory }}/{{ webmail_release.file }}"
  register: webmail_stat_archive

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - webmail_direct_download
  ansible.builtin.set_fact:
    webmail_delegate_to: "{{ ansible_facts.host }}"
    webmail_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/webmail', true) }}/{{ webmail_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ webmail_delegate_to }}"
  run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ webmail_local_tmp_directory }}"
    state: directory
    mode: "0750"
  check_mode: false

- name: detect the downloaded webmail archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ webmail_delegate_to }}"
  run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ webmail_local_tmp_directory }}/{{ _release.file }}"
  register: stat_webmail_archive

- name: download
  when:
    - not running_in_check_mode
    - webmail_stat_archive.stat is defined
    - not webmail_stat_archive.stat.exists | default('false')
  block:

    - name: download webmail binary archive
      become: false
      delegate_to: "{{ webmail_delegate_to }}"
      run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _release.download_url }}"
        username: "{{ _webmail_scm_user | default(omit, true) }}"
        password: "{{ _webmail_scm_token | default(omit, true) }}"
        dest: "{{ webmail_local_tmp_directory }}/{{ _release.file }}"
        checksum: "{{ _release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ webmail_delegate_to }}"
      run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ webmail_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  become: false
  delegate_to: "{{ webmail_delegate_to }}"
  run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ webmail_local_tmp_directory }}/{{ _release.file }}"
  register: webmail_stat_archive

- name: detect extracted binary
  become: false
  delegate_to: "{{ webmail_delegate_to }}"
  run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ webmail_local_tmp_directory }}/{{ webmail_release.binary }}"
  register: webmail_stat_binary

- name: extract webmail archive
  when:
    - not running_in_check_mode
    - webmail_stat_archive.stat is defined
    - webmail_stat_archive.stat.exists | default('false') | bool
    - webmail_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - webmail_stat_binary.stat is defined
    - not webmail_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ webmail_delegate_to }}"
  run_once: "{{ 'false' if webmail_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ webmail_local_tmp_directory }}/{{ _release.file }}"
    dest: "{{ webmail_local_tmp_directory }}/"
    remote_src: "{{ 'true' if webmail_direct_download else 'false' }}"
    extra_opts:
      - --strip-components=1
