postfix_mydestinations:
  - $myhostname
  - "{{ postfix_hostname }}"
  - localdomain
  - localhost
  - localhost.localdomain

postfix_mynetworks:
  - 127.0.0.0/8

# # postfix_raw_options:
# #   - |
# #     milter_default_action = accept
# #     milter_protocol = 6
# #     smtpd_milters = unix:opendkim/opendkim.sock unix:opendmarc/opendmarc.sock unix:spamass/spamass.sock unix:clamav/clamav-milter.ctl
# #     milter_connect_macros = "i j {daemon_name} v {if_name} _"
# #     policyd-spf_time_limit = 3600

postfix_handle_mastercf: true

postfix_master:
  # local smtp on port 26
  - name: 127.0.0.1:26
    type: inet
    # enabled: false
    private: false
    chroot: false
    command: smtpd
    options:
      syslog_name: postfix/local26
      smtpd_tls_security_level: none
      smtpd_tls_auth_only: false
      smtpd_sasl_auth_enable: true
      smtpd_client_restrictions:
        - permit_sasl_authenticated
        - reject
      smtpd_receipient_restrictions:
        - permit_sasl_authenticated
        - reject

  - name: submission
    state: disabled
    type: inet
    # enabled: false
    private: false
    chroot: false
    command: smtpd
    options:
      syslog_name: postfix/submission
      smtpd_tls_security_level: encrypt
      smtpd_sasl_auth_enable: true
      smtpd_tls_auth_only: true
      smtpd_relay_restrictions:
        - permit_sasl_authenticated
        - reject

  - name: dnsblog
    type: unix
    # private: false
    chroot: true
    maxproc: 0
    command: dnsblog

  - name: smtp
    type: inet
    private: false
    chroot: false
    command: postscreen

  - name: smtps
    type: inet
    private: false
    chroot: false
    command: postscreen

  - name: dovecot
    type: unix
    unpriv: false
    chroot: false
    command: pipe
    args: "flags=DRhu user=vmail:vmail argv=/usr/lib/dovecot/deliver -f ${sender} -d ${recipient}"

...
