---

nginx_vhosts:

  - name: default
    filename: 90-default.conf
    description: |
      simply a default vhost

    logfiles:
      access:
        file: /var/log/nginx/default/access.log
        loglevel: json_combined
      error:
        file: /var/log/nginx/default/error.log
        loglevel: notice

    ssl:
      enabled: false

  - name: nginx-status
    filename: 00-status.conf
    domains:
      - localhost

    listen:
      - 127.0.0.1:8888

    root_directory: /var/www/

    locations:
      "/nginx_status":
        options: |
          stub_status on;
          access_log off;
          allow 127.0.0.1;
          deny all;

  - name: mailmonkey
    filename: 10-mailmonkey.conf

    domains:
      - monkey.molecule.lan

    listen:
      - 443

    root_directory: /var/www/monkey.molecule.lan/htdocs
    root_directory_create: false

    index:
      - index.html

    logfiles:
      access:
        file: /var/log/nginx/monkey.molecule.lan/access.log
        loglevel: 'json_combined'
      error:
        file: /var/log/nginx/monkey.molecule.lan/error.log
        loglevel: notice

    ssl:
      enabled: true
      ciphers: default
      certificate: /etc/snakeoil/molecule.lan/molecule.lan.pem
      certificate_key: /etc/snakeoil/molecule.lan/molecule.lan.key
      dhparam: /etc/snakeoil/molecule.lan/dh.pem

    locations:
      "/":
        options: |
          add_header X-Backend "mailcow";

          proxy_pass          http://mailmonkey;
          proxy_http_version  1.1;
          proxy_set_header    Upgrade           $http_upgrade;
          proxy_set_header    Connection        "upgrade";

          proxy_set_header    Host              $host;
          proxy_set_header    X-Real-IP         $remote_addr;
          proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header    X-Forwarded-Proto $scheme;

          proxy_redirect off;
