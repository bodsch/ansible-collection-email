    user: "mailmonkey"                              # mailmonkey_acme
    password: "{{ vault__mariadb.mailmonkey }}"
    password_file: /etc/mailmonkey/acme-db-password
    name: "mailmonkey"                                      # mailmonkey    - (default mailmonkey)
