---

mailmonkey_config:
  log:
    level: info          # debug | info | warn | error
    format: text         # json | text  (json for journald, text to read)

  # The parentheses in a DSN are go-sql-driver's grammar, not ours:
  #   user:pass@tcp(host:port)/name
  #   user:pass@unix(/run/mysqld/mysqld.sock)/name
  db:
    # dsn: mailmonkey:secret@unix(/run/mysqld/mysqld.sock)/mailmonkey
    # dsn_file: /etc/mailmonkey/db-dsn
    # socket: ""                                    # /run/mysqld/mysqld.sock
    host: "10.29.1.10"                                      # 127.0.0.1     - (instead of socket)
    port: "3306"                                      # 3306          - (with host; default 3306)
    user: "mailmonkey"                                      # mailmonkey
    password: "{{ vault__mariadb.mailmonkey }}"                                  # secr3t
    password_file: /etc/mailmonkey/db-password
    name: "mailmonkey"                                      # mailmonkey    - (default mailmonkey)

  # ----------------------------------------------------------- the web service --
  listen: "127.0.0.1:8080"                        # (default :8080)
  metrics_listen: "127.0.0.1:9110"                              # (empty disables it)
  base_url: https://mail.example.com
  primary_domain: example.com                     # (optional)

  # ------------------------------------------------------------- the mail host --
  mail:
    hostname: ""                                  # mx.example.com
    ipv4: ""                                      # 127.0.0.1
    ipv6: ""                                      # 2001:db8::25

  # ---------------------------------------------------------------- MTA-STS -----
  mta_sts:
    mode: ""                                      # none | testing | enforce
    max_age: ""                                   # 604800        -  seconds (default one week)

  # ------------------------------------------------- password recovery mail -----
  smtp:
    addr: 127.0.0.1:25                            # (loopback only)
    from: ""                                      # mailmonkey@mx.example.com - set this to switch recovery on

  # -------------------------------------------------- zweiter Faktor (TOTP) -----
  totp:
    key: ""                                       # 0123456789abcdef...
    key_file: ""                                  # /etc/mailmonkey/totp.key

  # ---------------------------------------------------------------- Sessions -----
  session:
    idle_timeout: 30m
    max_lifetime: 12h

  # ------------------------------------------------------- Passwortrichtlinie -----
  password:
    min_length: 12
    deny_common: true
    deny_username: true
    min_classes: 0                                # 0 bis 4
    min_digits: 1
    min_upper: 1
    min_lower: 1
    min_special: 1

  # ------------------------------------------------------------------ redis -----
  redis:
    addr: "database:6379"                                      # /var/run/redis/redis.sock   - (Socket bevorzugt)
    password: ""                                  # secret
    password_file: ""                             # /etc/mailmonkey/redis-password
    db: 0

  # -------------------------------------------------------------- bootstrap -----
  bootstrap:
    admin: "admin@example.com"                                     # admin@example.com
    password: "{{ vault__mailmonkey.bootstrap }}"  # secret
    password_file: ""                             # /etc/mailmonkey/bootstrap-password

mailmonkey_acme:
